alchemy-mcp-server:
  workloads:
  - name: alchemy-mcp-server-mcp
    image: 209202477790.dkr.ecr.us-east-1.amazonaws.com/alchemy-mcp-server
    tag: 0.3.5
    imagePullPolicy: IfNotPresent
    workloadType: deployment
    rolloutEnabled: false
    replicas: 2
    labels:
      team: agent-experience
      environment: prod
    ingress:
      enabled: true
      port: 3000
    customDomains:
    - commonName: mcp.alchemy.com
      domains:
      - mcp.alchemy.com
      dnsProvider: cloudflare
      shortName: mcp
    ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
    env:
    - name: REDIS_HOST
      value: "master.alchemy-mcp-server-prod.z3x987.use1.cache.amazonaws.com"
    - name: AUTHCHEMY_BASE_URL
      value: "https://authchemy-prod-alb-978744611.us-east-1.elb.amazonaws.com"
    command: []
    args: []
