name: Claude - Auto PR review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: OMGWINNING/github-actions-workflows/.github/workflows/claude-pr-review.yaml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
