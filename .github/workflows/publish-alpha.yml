name: Publish Alpha

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        env:
          SKIP_SKILL_SYNC: "1"
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm test
      - name: Check for changesets
        run: |
          if ! ls .changeset/*.md 1>/dev/null 2>&1; then
            echo "No changesets found; alpha publishes require at least one pending changeset."
            exit 1
          fi
      - name: Version alpha snapshot
        run: pnpm changeset version --snapshot alpha
        env:
          # Use workflow token for Changesets GitHub changelog lookups.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build alpha package
        run: pnpm run build
      - name: Publish alpha to npm
        run: pnpm changeset publish --tag alpha
