name: Publish Alpha

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        env:
          SKIP_SKILL_SYNC: "1"
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm test
      - name: Check for changesets
        run: |
          if ! ls .changeset/*.md 1>/dev/null 2>&1; then
            echo "No changesets found; alpha publishes require at least one pending changeset."
            exit 1
          fi
      - name: Version alpha prerelease
        run: |
          pnpm changeset pre enter alpha
          pnpm changeset version
          node <<'EOF'
          const fs = require("node:fs");

          const pkgPath = "package.json";
          const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));

          if (!/-alpha\.\d+$/.test(pkg.version)) {
            throw new Error(`Expected an alpha prerelease version, got ${pkg.version}`);
          }

          pkg.version = pkg.version.replace(
            /-alpha\.\d+$/,
            `-alpha.${process.env.GITHUB_RUN_NUMBER}`,
          );
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          EOF
        env:
          # Use workflow token for Changesets GitHub changelog lookups.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build alpha package
        run: pnpm run build
      - name: Publish alpha to npm
        run: pnpm changeset publish
        env:
          NPM_CONFIG_PROVENANCE: "false"
