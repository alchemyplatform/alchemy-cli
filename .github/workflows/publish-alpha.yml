name: Publish (Alpha / Stable)
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Publish Alpha' || 'Publish Stable' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      _info:
        description: Publishes an alpha release from the current branch.
        required: false
        default: ""

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: read
  id-token: write

jobs:
  alpha:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        env:
          SKIP_SKILL_SYNC: "1"
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm test
      - name: Version alpha prerelease
        run: |
          node -e "
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const base = pkg.version.replace(/-.*/, '');
          pkg.version = \`\${base}-alpha.${process.env.GITHUB_RUN_NUMBER}\`;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('Alpha version:', pkg.version);
          "
      - name: Build alpha package
        run: pnpm run build
      - name: Publish alpha to npm
        run: pnpm changeset publish --tag alpha
        env:
          NPM_CONFIG_PROVENANCE: "false"

  stable:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.ALCHEMY_BOT_COMPUTEV2_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.ALCHEMY_BOT_COMPUTEV2_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        env:
          SKIP_SKILL_SYNC: "1"
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm test
      - name: Check for changesets
        id: changesets
        run: |
          if ls .changeset/*.md 1>/dev/null 2>&1; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create signed commit and push
        if: steps.changesets.outputs.has_changesets == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git add -A
          git commit -S -m "chore: release v${VERSION}"
          git push
      - name: Publish to npm
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm run release
        env:
          NPM_CONFIG_PROVENANCE: "false"
      - name: Create GitHub release
        if: steps.changesets.outputs.has_changesets == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NOTES=$(sed -n "/^## ${VERSION}$/,/^## /{ /^## ${VERSION}$/d; /^## /d; p; }" CHANGELOG.md)
          gh release create "v${VERSION}" \
            --repo ${{ github.repository }} \
            --title "v${VERSION}" \
            --notes "${NOTES}" \
            --target main
