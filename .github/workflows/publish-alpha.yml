name: Publish (Alpha / Stable)
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Publish Alpha' || 'Publish Stable' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      _info:
        description: Publishes an alpha release from the current branch.
        required: false
        default: ""

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  statuses: read
  contents: write
  pull-requests: write
  id-token: write

jobs:
  alpha:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        env:
          SKIP_SKILL_SYNC: "1"
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm test
      - name: Version alpha prerelease
        run: |
          node -e "
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const base = pkg.version.replace(/-.*/, '');
          pkg.version = \`\${base}-alpha.\${process.env.GITHUB_RUN_NUMBER}\`;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('Alpha version:', pkg.version);
          "
      - name: Build alpha package
        run: pnpm run build
      - name: Publish alpha to npm
        run: pnpm changeset publish --tag alpha
        env:
          NPM_CONFIG_PROVENANCE: "false"

  stable:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.ALCHEMY_BOT_COMPUTEV2_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.ALCHEMY_BOT_COMPUTEV2_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        env:
          SKIP_SKILL_SYNC: "1"
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm test
      - name: Check for changesets
        id: changesets
        run: |
          if ls .changeset/*.md 1>/dev/null 2>&1; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create or update release PR
        id: release-pr
        if: steps.changesets.outputs.has_changesets == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BRANCH: release/main
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git checkout -B "${RELEASE_BRANCH}"
          git add -A
          git commit -S -m "chore: release v${VERSION}"
          git push --force-with-lease origin "HEAD:${RELEASE_BRANCH}"

          PR_URL=$(gh pr list \
            --base main \
            --head "${RELEASE_BRANCH}" \
            --state open \
            --json url \
            --jq '.[0].url // ""')

          if [ -z "${PR_URL}" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "${RELEASE_BRANCH}" \
              --title "chore: release v${VERSION}" \
              --body "Version packages for v${VERSION}.")
          else
            gh pr edit "${PR_URL}" \
              --title "chore: release v${VERSION}" \
              --body "Version packages for v${VERSION}."
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
      - name: Wait for release PR checks
        if: steps.changesets.outputs.has_changesets == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          sleep 15
          gh pr checks "${{ steps.release-pr.outputs.pr_url }}" \
            --required \
            --watch \
            --fail-fast
      - name: Publish to npm
        if: steps.changesets.outputs.has_changesets == 'true'
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          VERSION="${{ steps.release-pr.outputs.version }}"

          if npm view "@alchemy/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "@alchemy/cli@${VERSION} is already published; skipping npm publish."
          else
            pnpm run release
          fi
      - name: Create GitHub release
        if: steps.changesets.outputs.has_changesets == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ steps.release-pr.outputs.version }}"
          RELEASE_SHA=$(git rev-parse HEAD)
          NOTES=$(sed -n "/^## ${VERSION}$/,/^## /{ /^## ${VERSION}$/d; /^## /d; p; }" CHANGELOG.md)

          if gh release view "v${VERSION}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "GitHub release v${VERSION} already exists; skipping release creation."
          else
            gh release create "v${VERSION}" \
              --repo ${{ github.repository }} \
              --title "v${VERSION}" \
              --notes "${NOTES}" \
              --target "${RELEASE_SHA}"
          fi
      - name: Merge release PR
        if: steps.changesets.outputs.has_changesets == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "${{ steps.release-pr.outputs.pr_url }}" \
            --squash \
            --delete-branch
